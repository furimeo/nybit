name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU for AArch64 emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static gcc

      - name: Build and Run Test Suite
        run: |
          chmod +x build.sh
          ./build.sh --run-tests

      - name: Verify Zero Memory Leak
        run: |
          ./bin/test_runner | tee test_out.txt
          grep -qE "all [0-9]+ tests passed \([0-9]+ skipped, 0 bytes leaked\)" test_out.txt

      - name: Run Benchmarks
        run: |
          ./build.sh --run-bench

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - name: Build and Run Test Suite (Native ARM64)
        run: |
          chmod +x build.sh
          ./build.sh --run-tests

      - name: Verify Zero Memory Leak and Native ARM64 Execution
        run: |
          ./bin/test_runner | tee test_out.txt
          grep -qE "all [0-9]+ tests passed \([0-9]+ skipped, 0 bytes leaked\)" test_out.txt
          ! grep -q "test_aarch64_rt_trivial_return: skipped" test_out.txt

  windows-x86_64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build and Run Test Suite (Windows)
        shell: msys2 {0}
        run: |
          ./build.sh --run-tests

      - name: Verify Zero Memory Leak (Windows)
        shell: msys2 {0}
        run: |
          ./bin/test_runner.exe | tee test_out.txt
          grep -qE "all [0-9]+ tests passed \([0-9]+ skipped, 0 bytes leaked\)" test_out.txt

  package-linux-x86_64:
    runs-on: ubuntu-latest
    needs: [linux-x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Install Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - name: Build Package
        run: |
          chmod +x build.sh
          ./build.sh --package

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: nybit-linux-x86_64
          path: dist/nybit-linux-x86_64.tar.gz

  package-linux-aarch64:
    runs-on: ubuntu-24.04-arm
    needs: [linux-arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Install Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - name: Build Package
        run: |
          chmod +x build.sh
          ./build.sh --package

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: nybit-linux-aarch64
          path: dist/nybit-linux-aarch64.tar.gz

  package-windows-x86_64:
    runs-on: windows-latest
    needs: [windows-x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build Package
        shell: pwsh
        run: |
          .\build.ps1 -Package

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: nybit-windows-x86_64
          path: dist/nybit-windows-x86_64.zip
