name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU for AArch64 emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static gcc

      - name: Build and Run Test Suite
        run: |
          chmod +x build.sh
          ./build.sh --run-tests

      - name: Verify Zero Memory Leak
        run: |
          ./bin/test_runner | tee test_out.txt
          grep -q "all 250 tests passed (0 bytes leaked)" test_out.txt

      - name: Run Benchmarks
        run: |
          ./build.sh --run-bench

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - name: Build and Run Test Suite (Native ARM64)
        run: |
          chmod +x build.sh
          ./build.sh --run-tests

      - name: Verify Zero Memory Leak
        run: |
          ./bin/test_runner | tee test_out.txt
          grep -q "all 250 tests passed (0 bytes leaked)" test_out.txt

  windows-x86_64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build and Run Test Suite (Windows)
        shell: msys2 {0}
        run: |
          ./build.sh --run-tests

  packaging:
    runs-on: ubuntu-latest
    needs: [linux-x86_64, linux-arm64, windows-x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Build Package Artifacts
        run: |
          chmod +x build.sh
          ./build.sh
          mkdir -p dist/nybit-linux-x86_64/bin dist/nybit-linux-x86_64/lib dist/nybit-linux-x86_64/include
          cp bin/nybit dist/nybit-linux-x86_64/bin/
          cp bin/*.a dist/nybit-linux-x86_64/lib/
          cp -r include/* dist/nybit-linux-x86_64/include/
          cp LICENSE dist/nybit-linux-x86_64/
          tar -czf nybit-linux-x86_64.tar.gz -C dist nybit-linux-x86_64

      - name: Upload Release Archive
        uses: actions/upload-artifact@v4
        with:
          name: nybit-linux-x86_64
          path: nybit-linux-x86_64.tar.gz
