name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Compiler & QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc qemu-user-static

      - name: Build & Run Test Suite
        run: |
          chmod +x build.sh
          ./build.sh --run-tests

      - name: Build Package
        run: |
          ./build.sh --package

      - name: Upload Linux x86-64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nybit-linux-x86_64
          path: dist/nybit-linux-x86_64.tar.gz

  build-linux-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - name: Build & Run Test Suite (Native ARM64)
        run: |
          chmod +x build.sh
          ./build.sh --run-tests

      - name: Verify Zero Memory Leak and Native ARM64 Execution
        run: |
          ./bin/test_runner | tee test_out.txt
          grep -qE "all [0-9]+ tests passed \([0-9]+ skipped, 0 bytes leaked\)" test_out.txt
          ! grep -q "test_aarch64_rt_trivial_return: skipped" test_out.txt

      - name: Build Package
        run: |
          ./build.sh --package

      - name: Upload Linux AArch64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nybit-linux-aarch64
          path: dist/nybit-linux-aarch64.tar.gz

  build-windows-x86_64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Run Test Suite (Windows)
        shell: msys2 {0}
        run: |
          ./build.sh --run-tests

      - name: Build Package
        shell: pwsh
        run: |
          .\build.ps1 -Package

      - name: Upload Windows x86-64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nybit-windows-x86_64
          path: dist/nybit-windows-x86_64.zip

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-linux-x86_64, build-linux-aarch64, build-windows-x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux x86-64 Archive
        uses: actions/download-artifact@v4
        with:
          name: nybit-linux-x86_64
          path: dist/

      - name: Download Linux AArch64 Archive
        uses: actions/download-artifact@v4
        with:
          name: nybit-linux-aarch64
          path: dist/

      - name: Download Windows x86-64 Archive
        uses: actions/download-artifact@v4
        with:
          name: nybit-windows-x86_64
          path: dist/

      - name: Generate SHA-256 Checksums
        run: |
          cd dist
          sha256sum nybit-linux-x86_64.tar.gz nybit-linux-aarch64.tar.gz nybit-windows-x86_64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/nybit-linux-x86_64.tar.gz
            dist/nybit-linux-aarch64.tar.gz
            dist/nybit-windows-x86_64.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
